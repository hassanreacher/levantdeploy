<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Not deployed</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #0a0a0a; --muted: #666; --border: #eaeaea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #ededed; --muted: #a1a1a1; --border: #2e2e2e; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .box { display: flex; align-items: center; gap: 20px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0; padding-right: 20px; border-right: 1px solid var(--border); }
  p { margin: 0; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="box">
    <h1>404</h1>
    <div>
      <p><strong style="color:var(--fg)">This deployment could not be found.</strong></p>
      <p>Nothing is deployed at this address yet. <small>LevantDeploy</small></p>
    </div>
  </div>
</main>
</body>
</html>
