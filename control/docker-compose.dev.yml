# Local development services for the control plane (Postgres 16 + Redis 7).
#   docker compose -f docker-compose.dev.yml up -d
#   cp .env.example .env && npm install && npm run db:push && npm run db:seed && npm run dev
# (Production stack lives in the repo root docker-compose.yml — owned by the ops area.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: levantdeploy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
volumes:
  pgdata:
  redisdata:
